<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #eee; border-radius: 5px; }
        h2 { color: #01329C; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .field { margin-bottom: 15px; }
        .label { font-weight: bold; color: #555; }
        .value { background: #f9f9f9; padding: 10px; border-radius: 4px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>New Professional Contact Request</h2>
        
        <div class="field">
            <div class="label">Name:</div>
            <div class="value">{{name}}</div>
        </div>

        <div class="field">
            <div class="label">Phone Number:</div>
            <div class="value">{{phone}}</div>
        </div>

        <div class="field">
            <div class="label">Preferred Date and Time:</div>
            <div class="value">{{datetime}}</div>
        </div>

        <div class="field">
            <div class="label">Brief Background Information:</div>
            <div class="value">{{background}}</div>
        </div>
    </div>
</body>
</html>
